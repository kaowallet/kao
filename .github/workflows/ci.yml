name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Optional WalletConnect Cloud project_id. When the repo secret is set,
  # CI compiles with the real id baked in; otherwise the placeholder in
  # `walletconnect::runtime` is used. We intentionally don't fail CI when
  # the secret is absent — fork PRs and contributor branches don't have
  # access to org secrets, and we want their clippy/test jobs to pass.
  # Release builds (see release.yml) consume the same secret with the
  # placeholder fallback removed.
  KAO_WC_PROJECT_ID: ${{ secrets.KAO_WC_PROJECT_ID }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    env:
      CARGO_VET_VERSION: 0.10.2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/cargo-vet
          key: cargo-vet-bin-${{ env.CARGO_VET_VERSION }}
      - name: install cargo-vet
        run: |
          cargo install --root ${{ runner.tool_cache }}/cargo-vet \
            --version ${{ env.CARGO_VET_VERSION }} \
            --locked cargo-vet
          echo "${{ runner.tool_cache }}/cargo-vet/bin" >> $GITHUB_PATH
      - name: cargo vet
        run: cargo vet --locked
