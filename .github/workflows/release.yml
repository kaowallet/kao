name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  verify-ci:
    name: verify ci passed
    runs-on: ubuntu-latest
    steps:
      - name: wait for ci.yml to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Waiting for ci.yml to finish for ${{ github.sha }}..."
          for i in $(seq 1 30); do
            result=$(gh run list \
              --commit "${{ github.sha }}" \
              --workflow ci.yml \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] // empty')
            if [ -z "$result" ]; then
              echo "Attempt $i/30: no ci.yml run found yet, waiting 60s..."
              sleep 60
              continue
            fi
            status=$(echo "$result" | jq -r '.status')
            conclusion=$(echo "$result" | jq -r '.conclusion')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed."
                exit 0
              else
                echo "CI finished with conclusion: $conclusion"
                exit 1
              fi
            fi
            echo "Attempt $i/30: CI status=$status, waiting 60s..."
            sleep 60
          done
          echo "Timed out waiting for CI."
          exit 1

  verify-version:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare tag and package version
        shell: bash
        run: |
          set -euo pipefail
          # Skipped in-script, not via job `if:`, because a skipped job
          # also skips every job that needs it.
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Not a tag build; skipping."
            exit 0
          fi
          want="${GITHUB_REF_NAME#v}"
          have=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$have" != "$want" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but Cargo.toml says $have. Bump Cargo.toml and Cargo.lock, then re-tag."
            exit 1
          fi
          echo "Cargo.toml version $have matches $GITHUB_REF_NAME."

  build:
    name: build (${{ matrix.target }})
    needs: [verify-ci, verify-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            packager-formats: appimage,deb,pacman
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            packager-formats: appimage,deb,pacman
          - os: macos-latest
            target: aarch64-apple-darwin
            packager-formats: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            packager-formats: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cache cargo-packager
        id: cache-packager
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-packager.exe
          key: cargo-packager-${{ env.CARGO_PACKAGER_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: install cargo-packager
        if: steps.cache-packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version ${{ env.CARGO_PACKAGER_VERSION }} --locked

      - name: install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y

      - name: install AppImage deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          cargo packager --release \
            --target ${{ matrix.target }} \
            --formats ${{ matrix.packager-formats }} \
            --out-dir dist/installers

      - name: package flatpak
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 24.04's Flatpak is 1.14, which rejects --device=usb.
          # The Freedesktop 26.08 image has a current Flatpak plus the runtime.
          # It runs privileged over the checkout, so it is pinned to the
          # multi-arch index digest of the freedesktop-26.08 tag; bump by
          # re-resolving that tag.
          docker run --rm --privileged --user root --entrypoint bash \
            -e KAO_FLATPAK_VERSION="${GITHUB_REF_NAME#v}" \
            -e KAO_FLATPAK_OWNER="$(id -u):$(id -g)" \
            -v "$PWD:/src" \
            -w /src \
            ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039 \
            -lc './flatpak/build.sh "target/${{ matrix.target }}/release/kao" dist/installers'

      - name: rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/out
          stem="kao-${{ github.ref_name }}-${{ matrix.target }}"
          for f in dist/installers/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              # cargo-packager's pacman format is not a .pkg.tar.* package:
              # it emits a kao_<version>_<arch>.tar.gz filesystem tarball
              # plus a PKGBUILD whose source= names that tarball. Both Linux
              # legs emit a file called PKGBUILD, which download-artifact's
              # merge-multiple would collapse into one, so it gets the
              # target in its name and its source= follows the rename.
              kao_*.tar.gz) mv "$f" "dist/out/$stem.tar.gz" ;;
              PKGBUILD)
                sed -E "s|^source=\(.*\)\$|source=(\"$stem.tar.gz\")|" "$f" > "dist/out/$stem.PKGBUILD"
                grep -qxF "source=(\"$stem.tar.gz\")" "dist/out/$stem.PKGBUILD" || {
                  echo "::error::PKGBUILD has no single-line source=() to point at $stem.tar.gz"
                  exit 1
                }
                rm "$f"
                ;;
              *.exe)        mv "$f" "dist/out/$stem-setup.exe" ;;
              *.dmg)        mv "$f" "dist/out/$stem.dmg" ;;
              *.AppImage)   mv "$f" "dist/out/$stem.AppImage" ;;
              *.deb)        mv "$f" "dist/out/$stem.deb" ;;
              *.flatpak)    mv "$f" "dist/out/$stem.flatpak" ;;
              *)            mv "$f" "dist/out/${base}" ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/out/*
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: sign artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          # The .sigstore.json bundle is what the README verifies against:
          # cosign 3 deprecates verify-blob's --signature/--certificate and
          # its next major drops them. .sig/.pem stay for older cosign.
          for f in *.exe *.dmg *.AppImage *.deb *.tar.gz *.PKGBUILD *.flatpak SHA256SUMS; do
            cosign sign-blob --yes "$f" \
              --new-bundle-format --bundle "$f.sigstore.json" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
