[workspace]
members = ["xtask"]
exclude = ["vendor/op-alloy-network"]

[package]
name = "kao"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alloy = { version = "2.0.1", features = ["full", "signer-mnemonic", "signer-ledger", "signer-trezor", "dyn-abi", "eip712"] }
async-trait = "0.1"
# Helios's API is built against alloy 1.x; we need its BlockId type to call
# eth_getBalance against the verified light-client. alloy 1.x and 2.x share
# the same alloy-primitives version (1.5.7), so Address/U256/B256 cross the
# boundary unchanged — only block-id types need the v1 import.
alloy-eips = "1"
# Same alloy-1 boundary as `alloy-eips`: needed to construct the
# `TransactionRequest` Helios's `HeliosClient::call` accepts. Without
# this, clear-signing's `symbol()` / `decimals()` probes against ERC-20
# targets fall through the unverified raw provider — which means an
# attacker on the RPC could lie about a contract's symbol/decimals,
# and the user signs trusting cosmetic metadata. With it, those reads
# go through Helios's verified eth_call (re-executes locally against
# proof-verified state), matching the verification guarantee
# `get_code` and `get_storage_at` already provide.
alloy-rpc-types-eth = "1"
# Helios's OpStack network uses `OpTransactionRequest` (a wrapper around
# alloy-1's TransactionRequest with deposit-tx support) for its `call`
# input. Already in the dep graph as a transitive — pulling it direct
# so we can construct values.
op-alloy-rpc-types = "0.20"
argon2 = "0.5.3"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# Standard padded base64 (RFC 4648). Used to encode WalletConnect Sign v2
# envelope bytes into the relay's JSON-RPC string payload field — every
# `Publish` carries the envelope as a base64 string. Not a security
# boundary; the encryption is the AEAD beneath it.
base64 = "0.22"
chacha20poly1305 = "0.10.1"
dirs = "6"
# UTS-46 / ENSIP-15 normalization for ENS names. Rejects bidi controls,
# zero-width chars, mixed-script confusables, and other display-spoofing
# inputs that a naive ASCII-lowercase pass would accept.
ens-normalize-rs = "0.1.1"
# Bytecode introspection — extracts function selectors and arg-type lists
# from EVM bytecode without needing source. Used by clear-signing to
# narrow ambiguous 4byte matches by intersecting with what the contract
# actually implements, and to fall back to "selector + arg types only"
# when 4byte has no entry. MIT-licensed; uses alloy-dyn-abi internally.
evmole = "0.8"
futures = "0.3"
getrandom = "0.4.2"
# Hex decoding for the `symKey` parameter of `wc:` pairing URIs and the
# `topic` segment (both spec'd as lowercase hex). No security boundary;
# the AEAD beneath the symKey is what authenticates.
hex = "0.4"
# HKDF-SHA256 for WalletConnect Sign v2 session-key derivation:
# `HKDF(salt=empty, ikm=x25519_shared_secret, info=empty, len=32)` produces
# the session symKey from the ECDH output during sessionSettle handshake.
# Spec: https://specs.walletconnect.com/2.0/specs/clients/core/crypto/crypto-keys
hkdf = "0.12"
# Pinned to commit on tag 0.11.1. Bump deliberately rather than tracking a branch.
helios-ethereum = { git = "https://github.com/a16z/helios", rev = "204c998a927348e1c000a664f08d5b37b1b0d924" }
# Same git rev as helios-ethereum: both crates ship from the a16z/helios
# workspace and share types (alloy versions, network presets, etc.). The
# OP-Stack client wraps Helios's verified L1 anchor with L2 fault-proof
# bootstrap; the wallet uses it for Base / Optimism balance reads.
#
# Pulls in two upstream-broken transitive deps that we work around via
# [patch.crates-io] below: yanked `core2 0.4.0` (libp2p chain) and
# coherence-conflicting `op-alloy-network 0.20.0`. See the patch entries
# for the full story.
helios-opstack = { git = "https://github.com/a16z/helios", rev = "204c998a927348e1c000a664f08d5b37b1b0d924" }
iced = { version = "0.14.0", features = ["tokio", "image", "qr_code", "svg"] }
rand = "0.8"
redb = "4.1.0"
# Local EVM for transaction preflight. Pinned to the same version helios
# pulls in (cargo unifies them into one build of revm 29.0.1 instead of
# duplicating). The three `optional_*` features disable basefee / nonce /
# block-gas validation during simulation — preflight is advisory, so a tx
# whose nonce is one ahead of the on-chain account or whose max-fee
# happens to dip below the base-fee window should still simulate, not
# abort with a config error. Matches helios's own feature set verbatim
# (helios/Cargo.toml workspace dep, rev 204c998) so the unified build has
# the same EVM semantics inside Kao as Helios uses for its verified
# eth_call.
revm = { version = "29.0.1", default-features = false, features = [
    "std",
    "optional_block_gas_limit",
    "optional_eip3607",
    "optional_no_base_fee",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# rustls is in the dep graph twice over: reqwest's `rustls-tls` enables the
# `aws-lc-rs` provider, while `relay_client`'s `rustls` feature pulls in
# `ring`. With both providers compiled in, rustls 0.23 refuses to auto-pick a
# default and panics at first handshake ("Could not automatically determine
# the process-level CryptoProvider"). Adding rustls as a direct dep with
# `aws-lc-rs` makes `crypto::aws_lc_rs::default_provider()` callable from
# `main.rs` — see the `install_default()` call there. Default features are
# off so we don't accidentally double-link a third provider; `std` is the
# only must-have.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# WalletConnect Sign v2 relay transport. Apache-2.0. Pinned to the post-revert
# HEAD on `main` (rev `f8d83ae`) — `v0.32.0` predates the topic-format revert
# fix that landed in #106. Only `relay_client` (WebSocket + HTTP transport) and
# `relay_rpc` (auth tokens + domain types) are pulled in; the `cacao` feature
# is deliberately NOT enabled — it depends on `alloy 0.3` and would create a
# parallel alloy alongside Kao's `alloy 2.0.1`. We re-implement CACAO signing
# (if/when needed for one-click-auth) against alloy 2.x directly.
relay_client = { git = "https://github.com/reown-com/reown-rust", rev = "f8d83ae", default-features = false, features = ["rustls"] }
relay_rpc = { git = "https://github.com/reown-com/reown-rust", rev = "f8d83ae", default-features = false }
secrecy = "0.10.3"
# SHA-256 for WalletConnect Sign v2 topic derivation: `topic = sha256(symKey)`,
# 32 bytes, displayed as lowercase hex. Same crate version as helios's
# transitive sha2 0.10 — cargo unifies into one build.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# Ephemeral x25519 keypair for the WalletConnect Sign v2 sessionSettle
# handshake (Type 1 envelope). Wallet generates a one-shot keypair per
# pairing, sends its public key in the envelope header, and discards the
# secret after deriving the session symKey via ECDH + HKDF-SHA256.
#
# Note: a second x25519-dalek 1.1.1 already lives transitively in the
# build via libp2p-noise (helios-opstack → libp2p chain). Cargo links
# both. The 1.1.1 copy authenticates helios p2p sessions only; this 2.x
# direct dep handles WalletConnect's session-establishment crypto. They
# never share key material. Drop the 1.1.1 transitive when helios's
# libp2p dep updates.
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["derive"] }

# OS keyring access. Used as the external trust anchor for rollback-protection
# state that must not be roll-backable along with the wallet file. Per-target
# features select the platform-native backend; we deliberately avoid keyutils
# on Linux (kernel-only, doesn't survive reboot) and use Secret Service
# instead. `crypto-rust` keeps us off OpenSSL — matches the existing
# chacha20poly1305 / argon2 posture.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `vendored` statically links libdbus-1 into the binary so builds don't
# require `pkg-config` + libdbus headers in the environment. Runtime
# behaviour against the user's session bus is unchanged from a dynamic
# link. Drop `vendored` only if we move build infra to a machine that's
# guaranteed to have the system dev headers and we want to share libdbus
# with the rest of the desktop.
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"
# `test-util` enables `tokio::time::pause` / `start_paused = true`, which the
# reconnect-backoff tests use to advance the simulated clock instantly
# instead of literally sleeping 11+ seconds.
tokio = { version = "1", features = ["rt", "sync", "test-util", "macros"] }

# Workarounds for two upstream-broken transitive deps pulled in by
# helios-opstack. Drop both entries the moment the upstreams ship fixes
# (see each entry for the exact "drop when" condition).
[patch.crates-io]
# helios-opstack -> libp2p 0.51.3 -> multiaddr 0.17 -> multihash 0.17 ->
# core2 ^0.4.0 (yanked from crates.io). The unmodified upstream source of
# 0.4.0 still lives at this commit on bbqsrc/core2, so we point cargo
# straight at it to bypass the yank check. Pure source pin — no behavior
# change.
# Drop when: libp2p (or anything upstream of multihash) drops the core2
# dependency, or republishes a non-yanked 0.4.x.
core2 = { git = "https://github.com/bbqsrc/core2", rev = "545e84bcb0f235b12e21351e0c69767958efe2a7" }
# helios-opstack -> op-alloy-network 0.20.0 carries an explicit
# `impl NetworkWallet<Optimism> for EthereumWallet` that overlaps with
# alloy-network 1.x's blanket `impl<N: Network> NetworkWallet<N> for
# EthereumWallet`. Rust's coherence rule rejects the overlap (E0119) once
# both crates are linked into the same binary. We vendor a fork of the
# crate with the explicit impl deleted — see vendor/op-alloy-network/.
# Drop when: op-alloy-rs ships a release without the explicit impl AND
# helios-opstack's pinned rev consumes that release.
op-alloy-network = { path = "vendor/op-alloy-network" }
