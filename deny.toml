[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
# Threat-model note shared by every ignored advisory below.
#
# Every entry enters the build through helios (helios-core, helios-ethereum,
# or helios-opstack). The wallet's security-critical surfaces — Argon2id KDF,
# XChaCha20-Poly1305 authenticated storage, and transaction signing via
# alloy/k256 — are pure-rust crates that never call into any of the affected
# code. Helios's job is to talk to public RPCs and verify the responses with
# merkle / light-client proofs, so the blast radius for anything that
# subverts helios is bounded at "RPC peer can lie about chain state, light
# client catches the lie" — not key exfiltration.
#
# Entries are grouped by the helios subtree they live in. Revisit each group
# when helios upgrades the upstream dep that pins it (jsonrpsee 0.19,
# libp2p 0.51, reqwest's hickory-dns feature, alloy 1.x), or when any
# non-helios direct dep starts pulling the affected crate — that would be a
# new attack surface worth fixing at the source.
ignore = [
    # ── helios jsonrpsee-server subtree (jsonrpsee 0.19.0 server → hyper 0.14
    #    → h2 0.3.27) ───────────────────────────────────────────────────────
    # Since helios 43a8c9f (#804) jsonrpsee is built with server/macros/
    # client-core only, so its rustls 0.21 client stack (rustls-webpki 0.101,
    # rustls-pemfile 1, webpki-roots 0.24) is gone from the build. What remains
    # serves helios's optional local JSON-RPC server.
    { id = "RUSTSEC-2026-0258", reason = "h2 unbounded empty DATA frames (memory DoS / panic). Patched in h2 ≥0.4.16; the 0.4 line is on 0.4.19. h2 0.3.27 remains, pinned by jsonrpsee-server 0.19 → hyper 0.14 (http2 feature; no 0.3 patch). Only reachable through helios's local JSON-RPC server, which starts only when rpc_address/rpc_socket is set — Kao sets neither (net::build_eth_backend / build_op_backend), so no h2 connection is made. Revisit when helios moves off jsonrpsee 0.19." },

    # ── helios libp2p subtree (helios-opstack → libp2p 0.51 and friends) ─
    # libp2p here is op-stack peer transport. Its noise/identity keys are
    # ephemeral peer-transport keys generated at helios startup — completely
    # disjoint from the wallet's k256 signing keys.
    { id = "RUSTSEC-2024-0344", reason = "curve25519-dalek 3.2.0 Scalar29/Scalar52 timing variability, in libp2p-noise handshake. Worst case is leakage of helios's libp2p transport key, which only authenticates p2p sessions — wallet signing keys live in alloy/k256 and never reach this code." },
    { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 0.7.2 unmaintained. Used by libp2p-identity for p2p peer IDs only — wallet transaction signing goes through alloy/k256 directly. No known vuln." },
    { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 unmaintained. Time-measurement utility used by libp2p/parking_lot 0.11/wasm-timer. No known vuln, no exposure beyond clock reads." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 unmaintained. Build-time only, used by multihash-derive in the libp2p subtree. No runtime surface." },

    # ── helios DNS subtree (reqwest 0.12 → hickory-resolver/hickory-proto) ─
    # reqwest only uses hickory when the `hickory-dns` feature is on (helios
    # enables it). Both issues fail-closed into DoS: the wallet can't fetch
    # chain data, but keys never touch this path.
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25.2 NSEC3 closest-encloser proof: unbounded loop on cross-zone responses can OOM the resolver task. Caps at helios losing RPC connectivity; no fix path until helios moves to hickory 0.26." },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25.2 O(n²) name compression on encode: CPU DoS via crafted DNS messages. Same DoS-only cap as -0118." },

    # ── helios checkpoint-fallback subtree (helios-ethereum → serde_yaml 0.9
    #    → unsafe-libyaml) ─────────────────────────────────────────────────
    # helios-ethereum hard-depends on serde_yaml for CheckpointFallback, which
    # parses ethpandaops' endpoints.yaml. Unlike the entries above this one is
    # an in-process memory-safety concern, not a DoS cap — so note exactly when
    # it's reachable.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 unmaintained (archived; no known vuln, no safe upgrade). Only reachable when the initial mainnet sync from our own checkpoint fails: build_eth_backend sets load_external_fallback, so helios then fetches endpoints.yaml from raw.githubusercontent.com over TLS and parses it. Input is a TLS-authenticated, GitHub-hosted community list, not an RPC peer. Revisit when helios drops serde_yaml, or drop load_external_fallback (net::fetch_latest_checkpoint already replaces that discovery) to make the path dead." },

    # ── alloy/build-time ──────────────────────────────────────────────────
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained. Build-time proc-macro used by alloy-primitives via alloy-chains. No known vuln, no runtime surface." },

    # ── iced GUI font/glyph subtree (cosmic-text + usvg → fontdb → ttf-parser,
    #    resvg → usvg → rustybuzz) ──────────────────────────────────────────
    # The only non-helios, non-alloy entries: they enter through the GUI, not the
    # chain/signing path. These crates parse font files and shape/lay out glyph
    # outlines for on-screen text rendering only — they never see keys, encrypted
    # storage, signed payloads, or verified chain state, and the fonts/SVG assets
    # they read ship with the app.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 unmaintained (author won't ship further fixes; no known vuln). Reaches the tree via iced's text/SVG rendering (cosmic-text + usvg → fontdb). Glyph/font parsing for rendering only — disjoint from signing, storage, and chain verification. Revisit when iced/cosmic-text/usvg migrate to skrifa." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 unmaintained (maintainer points at harfrust; no known vuln). xtask's usvg 0.48 moved to harfrust, but iced still pins resvg ^0.45 → usvg 0.45 → rustybuzz for in-app SVG icons. Text shaping for bundled assets only — same rendering-path isolation as ttf-parser above. Revisit when iced bumps resvg." },

    # ── privacy-pools proving subtree (arkworks 0.5 → ark-relations →
    #    tracing-subscriber 0.2.25) ─────────────────────────────────────────
    # ark-relations pulls an ancient tracing-subscriber 0.2.25 for its optional
    # constraint-system tracing. The pool prover never installs a subscriber and
    # never logs untrusted input through one — proving is a pure in-memory
    # arkworks computation over the bundled zkey. The advisory is ANSI-escape
    # injection into terminal output, which needs attacker-controlled data to
    # reach a subscriber; neither condition holds on this path.
    { id = "RUSTSEC-2025-0055", reason = "tracing-subscriber 0.2.25 ANSI-escape injection, via ark-relations' optional constraint-tracing (arkworks 0.5, used by privacy-pools' Groth16 prover). No subscriber is installed on the proving path and no untrusted input is logged through it — proving is pure in-memory computation over the bundled circuit. Revisit if arkworks upgrades ark-relations' tracing dep." },
    { id = "RUSTSEC-2024-0388", reason = "derivative 2.2.0 unmaintained (build-time derive macro). Pulled by arkworks (ark-ff and friends) for Debug/Clone impls in privacy-pools' proving stack. No known vuln, no runtime surface. Revisit when arkworks migrates off it." },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix 0.4.0 unmaintained. Enters via indicatif (progress-bar formatting) inside circom-witnesscalc; the pool prover computes witnesses in-process and never drives indicatif's CLI progress UI. No known vuln, no runtime surface." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "Unlicense",
    # Kao itself.
    "AGPL-3.0-or-later",
    # Pulled in transitively by iced: clipboard-win, error-code.
    "BSL-1.0",
    # Pulled in transitively by iced → image → ravif → rav1e → libfuzzer-sys.
    "NCSA",
    # Mozilla's bundled root-cert list (webpki-roots, webpki-root-certs).
    "CDLA-Permissive-2.0",
    # evmole 0.9 → minicbor (CBOR metadata in bytecode). OSI-approved
    # permissive license, MIT-equivalent grant with a notice obligation.
    "BlueOak-1.0.0",
]
exceptions = [
    # WalletConnect v2 wallet side. GPLv3 §13 / AGPLv3 §13 permit combining it
    # with Kao's AGPL-3.0-or-later; scoped to this one crate so no other
    # GPL-3.0-only dependency can enter silently.
    { allow = ["GPL-3.0-only"], crate = "wallet-connect" },
]

# helios-* subcrates omit a `license` field in their per-crate Cargo.toml,
# but the workspace LICENSE at the repo root is MIT. Clarify each subcrate
# so cargo-deny treats them as MIT instead of unlicensed.
[[licenses.clarify]]
crate = "helios-common"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-consensus-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-ethereum"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-opstack"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-revm-utils"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-verifiable-api-client"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-verifiable-api-types"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
# The helios-ethereum and helios-opstack git deps appear as wildcards because
# they pin via `rev` rather than a published version. The rev pin is the
# stronger guarantee — accept the wildcard form for git/path deps only.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
# Threat-model note on openssl:
#
# We previously denied openssl/openssl-sys outright. Helios pulls them in
# anyway via reqwest's default `native-tls` feature (and `openssl` itself
# is a declared-but-unused workspace dep in helios with the "vendored"
# feature — so when openssl is present at all, it's statically linked,
# never the system copy). cargo features are additive across the build
# graph, so we can't suppress this from the consumer side; the only
# escape is forking helios.
#
# We accept coexistence:
#  - helios is the *only* path to openssl-vendored in the build. The
#    sensitive surfaces — key derivation (Argon2id), authenticated
#    storage (XChaCha20-Poly1305), and transaction signing (alloy/k256)
#    — are pure-rust and never touch openssl.
#  - helios's role is querying public chain data over TLS; responses are
#    merkle/light-client verified, so a TLS-stack compromise there
#    degrades to "RPC peer can lie about chain state, light client
#    catches the lie" rather than "MITM exfiltrates keys".
#  - openssl is the `vendored` build, so there's no system-libssl link
#    and no platform-version drift (esp. on Windows).
#
# Revisit if: (a) helios ships a rustls feature flag upstream, (b) we
# fork helios to flip reqwest's TLS features, or (c) any non-helios
# direct dep starts pulling openssl — that would be a new attack surface
# worth blocking.
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/a16z/helios",
    "https://github.com/bbqsrc/core2",
    "https://github.com/kaowallet/clear-signing",
    "https://github.com/kaowallet/privacy-pools",
    "https://github.com/kaowallet/wallet-connect",
]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
